name: ci

on:
  pull_request:
    paths:
      - "labs/week10-ci-cd/"
  push:
    paths:
      - "labs/week10-ci-cd/"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: pip install -r labs/week10-ci-cd/requirements.txt
      - name: Run pytest
        run: pytest -q