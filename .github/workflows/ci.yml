name: ci

# YOUR CODE (gap 1): add `push:` as a second trigger. Each trigger has its own `paths:` list under it
# (the key is `paths:` with an s). The order of the two triggers does not matter. Example shape:
#   on:
#     pull_request:
#       paths:
#         - "labs/week10-ci-cd/**"
#     push:
#       paths:
#         - "labs/week10-ci-cd/**"
on:
  pull_request:
    paths:
      - "labs/week10-ci-cd/**"
  push:
    paths:
      - "labs/week10-ci-cd/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/week10-ci-cd
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: labs/week10-ci-cd/requirements.txt
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
